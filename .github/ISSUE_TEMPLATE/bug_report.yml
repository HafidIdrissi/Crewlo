name: Bug report
description: Help us reproduce a Crewlo problem.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Crewlo. Keep tokens, private chats, personal paths, prompts and raw terminal logs out of public reports. Use the private security form for vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Crewlo from source
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Studio and agent activity
        - Mission delivery and conversations
        - Telegram
        - WhatsApp
        - Agent CLI or terminal
        - Installation or build
        - Website or documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Crewlo commit or version
      description: Run `git rev-parse --short HEAD` if you built from source.
  - type: textarea
    id: evidence
    attributes:
      label: Safe screenshot or test output (optional)
      description: Remove tokens, phone numbers, private chats and personal files before attaching anything.
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment (optional)
      description: Agent CLI/version, Node version, or a short redacted error message.
