name: Something else
description: A documentation, accessibility or other Crewlo request.
title: "[Other]: "
body:
  - type: markdown
    attributes:
      value: |
        For questions, first try [Crewlo Discussions](https://github.com/HafidIdrissi/Crewlo/discussions). Report security issues [privately](https://github.com/HafidIdrissi/Crewlo/security/advisories/new), never here.
  - type: textarea
    id: details
    attributes:
      label: What would you like us to know?
      description: Include enough context to act, without secrets or personal data.
    validations:
      required: true
