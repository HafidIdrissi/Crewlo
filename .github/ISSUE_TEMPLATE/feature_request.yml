name: Feature idea
description: Suggest a focused improvement to Crewlo.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Early ideas are welcome. For a larger proposal or open-ended discussion, use [Crewlo Discussions](https://github.com/HafidIdrissi/Crewlo/discussions).
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the task or friction before proposing a feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: A small example, sketch or acceptance criterion is useful.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Voxel studio and accessibility
        - Mission composer and delivery
        - Telegram or WhatsApp
        - Agent sessions and providers
        - Onboarding and installation
        - Documentation and community
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra context (optional)
      description: Add a safe screenshot or explain alternatives you tried. Do not include credentials or private chats.
