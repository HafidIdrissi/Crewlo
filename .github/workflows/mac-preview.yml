name: macOS preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            app: dist/mac-arm64/Crewlo.app
          - runner: macos-15-intel
            arch: x64
            app: dist/mac/Crewlo.app
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install setuptools
      - run: npm ci
      - run: npm run build
      # Ad-hoc signing only: no Apple identity, credentials or notarization.
      - name: Package DMG
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never -c.mac.identity=-
      - name: Verify packaged runtime and disk image
        run: |
          node tools/check-macos-package.cjs '${{ matrix.app }}' '${{ matrix.arch }}'
          hdiutil verify 'dist/Crewlo-0.4.6-mac-${{ matrix.arch }}.dmg'
          cd dist
          shasum -a 256 'Crewlo-0.4.6-mac-${{ matrix.arch }}.dmg' > 'Crewlo-0.4.6-mac-${{ matrix.arch }}.dmg.sha256'
      - uses: actions/upload-artifact@v4
        with:
          name: crewlo-mac-${{ matrix.arch }}
          path: |
            dist/Crewlo-*-mac-${{ matrix.arch }}.dmg
            dist/Crewlo-*-mac-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error
