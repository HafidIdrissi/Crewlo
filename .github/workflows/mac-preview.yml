name: macOS preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            app: dist/mac-arm64/Crewlo.app
          - runner: macos-15-intel
            arch: x64
            app: dist/mac/Crewlo.app
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install setuptools
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      # Ad-hoc signing only: no Apple identity, credentials or notarization.
      - name: Package DMG
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never -c.mac.sign=build/sign-mac-preview.cjs
      - name: Verify packaged runtime and disk image
        run: |
          node tools/check-macos-package.cjs '${{ matrix.app }}' '${{ matrix.arch }}'
          hdiutil verify 'dist/Crewlo-0.4.6-mac-${{ matrix.arch }}.dmg'
          cd dist
          shasum -a 256 'Crewlo-0.4.6-mac-${{ matrix.arch }}.dmg' > 'Crewlo-0.4.6-mac-${{ matrix.arch }}.dmg.sha256'
      - name: Mount DMG, copy and exercise first launch
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.2
          mkdir -p "$RUNNER_TEMP/crewlo-mount" "$RUNNER_TEMP/crewlo-installed"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/crewlo-mount" 'dist/Crewlo-0.4.6-mac-${{ matrix.arch }}.dmg'
          ditto "$RUNNER_TEMP/crewlo-mount/Crewlo.app" "$RUNNER_TEMP/crewlo-installed/Crewlo.app"
          hdiutil detach "$RUNNER_TEMP/crewlo-mount"
          node tools/check-installed-desktop.cjs "$RUNNER_TEMP/crewlo-installed/Crewlo.app/Contents/MacOS/Crewlo"
      - uses: actions/upload-artifact@v4
        with:
          name: crewlo-mac-${{ matrix.arch }}
          path: |
            dist/Crewlo-*-mac-${{ matrix.arch }}.dmg
            dist/Crewlo-*-mac-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error
